template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: PROTOLITH_REQUIRE_XVFB=1 cargo test --all-features
  fail_pattern: '^test (.+) \.\.\. FAILED$'
  known_red: []
out_of_scope:
  - {glob: "Cargo.lock", reason: "generated by cargo; changes only as a side effect of Cargo.toml"}
  - {glob: "src/font/terminus/*.bin", reason: "generated glyph tables, written by tools/gen-terminus.py from upstream Terminus BDF (OFL-1.1)"}
  - {glob: "third_party/", reason: "the Terminus Font's license notice and OFL text, kept as upstream gives them"}
  - {glob: "LICENSE-MIT", reason: "license text"}
  - {glob: "LICENSE-APACHE", reason: "license text"}
adoption:
  areas:
    - {name: core, globs: ["src/lib.rs", "src/error.rs", "src/pixel.rs", "src/fbdev.rs", "tests/fbdev.rs"]}
    - {name: x11-proto, globs: ["src/x11/proto/"]}
    - {name: x11, globs: ["src/x11/*.rs", "tests/xvfb.rs", "tests/xauth.rs"]}
    - {name: canvas, globs: ["src/canvas/"]}
    - {name: font, globs: ["src/font/mod.rs", "src/font/terminus.rs", "tools/"]}
    - {name: ui, globs: ["src/ui/"]}
    - {name: examples, globs: ["examples/"]}
    - {name: project, globs: [".github/", "Cargo.toml", "README.md", "CHANGELOG.md", "CLAUDE.md", "rustfmt.toml", ".gitignore"]}
nodes: []
